server:
  port: ${PORT:8080}

spring:
  application:
    name: typeahead-api
  datasource:
    # Prefer SUPABASE_DB_URL (JDBC session pooler string from Supabase Connect).
    # Falls back to local Postgres for development.
    url: ${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/typeahead}
    username: ${SUPABASE_DB_USER:typeahead}
    password: ${SUPABASE_DB_PASSWORD:typeahead}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
